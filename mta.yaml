----
ID: ariba-mcp-btp
_schema-version: "3.1"
version: 1.0.0
modules:
  - name: ariba-mcp-btp
    type: python
    path: .
    requires:
      - name: ariba-xsuaa
    parameters:
      memory: 256M
      disk-quota: 512M
      command: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 2
      routes:
        - route: ariba-mcp-btp.cfapps.xxxxx.hana.ondemand.com
resources:
  - name: ariba-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: xs-security.json
